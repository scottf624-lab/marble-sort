<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e1525">
<title>Marble Sort</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;background:#0e1525;color:#eef3ff;font-family:system-ui,-apple-system,sans-serif}
header{padding:14px 14px 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1{margin:0;font-size:1.2rem}
.stat{color:#ffd36a;font-weight:800}
.tubes{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:18px 16px;padding:12px 10px 20px}
.tube{width:58px;height:232px;position:relative;border:3px solid #9eb6d9;border-top:0;border-radius:10px 10px 30px 30px;background:#152238;flex:0 0 58px}
.tube.sel{border-color:#ffd36a;background:#1e3358}
.tube.done{border-color:#5ee09a}
.marble{position:absolute;left:5px;width:44px;height:44px;border-radius:50%;box-shadow:inset -6px -8px 10px rgba(0,0,0,.3),inset 5px 5px 8px rgba(255,255,255,.35)}
footer{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;padding:8px 12px 24px}
footer button,.card button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;font-size:1rem;background:#24324d;color:#fff}
button.gold{background:#ffd36a;color:#1a1408}
.overlay{display:none;position:fixed;inset:0;background:rgba(6,10,20,.72);align-items:center;justify-content:center;text-align:center;padding:24px}
.overlay.on{display:flex}
.card{background:#18233a;border-radius:20px;padding:28px 22px;max-width:360px;width:100%}
</style>
</head>
<body>
<header>
  <h1>MARBLE SORT</h1>
  <div class="stat">Level <span id="lv">1</span> · Moves <span id="mv">0</span></div>
</header>
<div class="tubes" id="tubes"></div>
<footer>
  <button type="button" id="undo">Undo</button>
  <button type="button" id="restart">Restart</button>
  <button type="button" class="gold" id="next">New mix</button>
</footer>
<div class="overlay" id="win">
  <div class="card">
    <h2>Sorted!</h2>
    <p id="winmsg">Nice work.</p>
    <button type="button" class="gold" id="go">Next level</button>
  </div>
</div>
<script>
(function(){
const H=4, SIZE=44, COLORS=["#e23d4d","#f0a202","#3ddc84","#3b82f6","#a855f7","#fb7185","#22d3ee","#84cc16","#f97316","#e5e7eb","#14b8a6","#c084fc"];
const $=id=>document.getElementById(id);
let level=1, tubes=[], start=[], hist=[], moves=0, sel=null;
try{level=+(localStorage.getItem("ms_lv")||1)||1}catch(e){}
function spec(lv){return Math.min(12,3+Math.floor((lv-1)/2))}
function clone(t){return t.map(x=>x.slice())}
function top(t){return t.length?t[t.length-1]:null}
function runLen(t){if(!t.length)return 0;let c=top(t),n=1;for(let i=t.length-2;i>=0&&t[i]===c;i--)n++;return n}
function complete(t){return t.length===H&&t.every(x=>x===t[0])}
function won(){return tubes.every(t=>!t.length||complete(t))}
function canPick(i){return tubes[i].length&&!complete(tubes[i])}
function canPour(a,b){
  if(a===b||!tubes[a].length||complete(tubes[a])||tubes[b].length>=H)return 0;
  const space=H-tubes[b].length, n=runLen(tubes[a]);
  if(tubes[b].length&&top(tubes[b])!==top(tubes[a]))return 0;
  return Math.min(n,space);
}
function scramble(n){
  const balls=[];for(let i=0;i<n;i++)for(let k=0;k<H;k++)balls.push(i);
  for(let i=balls.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[balls[i],balls[j]]=[balls[j],balls[i]]}
  const t=[];for(let i=0;i<n;i++)t.push(balls.slice(i*H,i*H+H));t.push([],[]);
  return t;
}
function draw(){
  $("lv").textContent=level;$("mv").textContent=moves;
  const el=$("tubes");el.innerHTML="";
  tubes.forEach((t,i)=>{
    const d=document.createElement("div");
    d.className="tube"+(sel===i?" sel":"")+(complete(t)?" done":"");
    const lift=sel===i?12:0;
    t.forEach((c,idx)=>{
      const m=document.createElement("div");
      m.className="marble";
      m.style.background=COLORS[c%COLORS.length];
      m.style.bottom=(8+idx*SIZE+lift)+"px";
      d.appendChild(m);
    });
    d.addEventListener("click",function(e){e.preventDefault();tap(i)});
    el.appendChild(d);
  });
}
function tap(i){
  if(sel==null){if(canPick(i))sel=i;draw();return}
  if(i===sel){sel=null;draw();return}
  const n=canPour(sel,i);
  if(n){pour(sel,i,n);return}
  sel=canPick(i)?i:null;draw();
}
function pour(a,b,n){
  hist.push({tubes:clone(tubes),moves});
  for(let k=0;k<n;k++)tubes[b].push(tubes[a].pop());
  moves++;sel=null;draw();
  if(won()){$("winmsg").textContent="Level "+level+" in "+moves+" moves.";$("win").classList.add("on")}
}
function deal(advance){
  if(advance){level++;try{localStorage.setItem("ms_lv",level)}catch(e){}}
  tubes=scramble(spec(level));start=clone(tubes);hist=[];moves=0;sel=null;$("win").classList.remove("on");draw();
}
$("undo").onclick=function(){if(!hist.length)return;const p=hist.pop();tubes=p.tubes;moves=p.moves;sel=null;draw()};
$("restart").onclick=function(){tubes=clone(start);hist=[];moves=0;sel=null;$("win").classList.remove("on");draw()};
$("next").onclick=function(){deal(false)};
$("go").onclick=function(){deal(true)};
try{deal(false)}catch(err){$("tubes").textContent="Could not start: "+err.message}
})();
</script>
</body>
</html>
